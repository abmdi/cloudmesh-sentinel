[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project]
name = "cloudmesh-sentinel"
version = "0.1.0"
description = "Multi-cloud network observability and security platform"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2,<3"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.8,<1"]
[tool.hatch.build.targets.wheel]
packages = ["src/cloudmesh_sentinel"]
[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]
