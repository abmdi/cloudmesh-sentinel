name: AI engineering proposals
on:
  schedule:
    - cron: '17 1,5,9,13,17,21 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: autonomous-proposals
  cancel-in-progress: false
jobs:
  propose:
    if: vars.AI_AGENT_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate bounded engineering proposal
        env:
          AI_AGENT_ENABLED: 'true'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: python automation/agent.py
      - name: Check change scope and content
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          git add -- docs/engineering/
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --cached --name-only)
          if [ "$(printf '%s\n' "$files" | wc -l)" -ne 1 ]; then exit 1; fi
          if ! printf '%s\n' "$files" | grep -Eq '^docs/engineering/[a-z0-9-]+\.md$'; then exit 1; fi
          git diff --cached --check
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Create reviewable PR (never auto-merge)
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branch="ai/engineering-proposal-${GITHUB_RUN_ID}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git commit -m 'docs: propose cloud network engineering design note'
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title 'docs: AI-assisted engineering design proposal' \
            --body 'AI-generated engineering proposal for review. This is documentation only, not implemented functionality. No automatic merge. CI and maintainer review required.'
